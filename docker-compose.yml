services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: newsfeed
      POSTGRES_PASSWORD: newsfeed
      POSTGRES_DB: newsfeed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsfeed -d newsfeed"]
      interval: 3s
      timeout: 3s
      retries: 20

  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || wget -qO- http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  storage-init:
    image: amazon/aws-cli
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        E="--endpoint-url http://storage:9000"
        until aws $$E s3api list-buckets >/dev/null 2>&1; do sleep 1; done
        aws $$E s3api create-bucket --bucket newsfeed-media 2>&1 || aws $$E s3api head-bucket --bucket newsfeed-media
        aws $$E s3api put-bucket-policy --bucket newsfeed-media --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::newsfeed-media/*"]}]}'

volumes:
  pgdata:
  storagedata:
